name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder Android
        run: |
          flutter create . --platforms=android --org com.ewasho --project-name ewasho
          rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Analisis kode
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E '^\s*(error|warning) ' analyze.txt | head -40 | while read -r l; do echo "::error::$l"; done
          exit $code

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log || {
            grep -iE 'error|FAILURE|What went wrong' -A2 build.log | head -40 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Ganti nama APK
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ewasho-preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ewasho-preview-apk
          path: ewasho-preview.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: EWASHO preview ${{ github.run_number }}
          files: ewasho-preview.apk
