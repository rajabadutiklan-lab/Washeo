name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder Android
        run: flutter create . --platforms=android --org com.ewasho --project-name ewasho

      - run: flutter pub get

      - name: Analisis kode
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Ganti nama APK
        run: mv build/app/outputs/flutter-apk/app-release.apk ewasho-preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ewasho-preview-apk
          path: ewasho-preview.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: EWASHO preview ${{ github.run_number }}
          files: ewasho-preview.apk
